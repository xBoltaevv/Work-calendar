<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8663e">
    <title>Work Calendar — Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="container">
        <h1>Login</h1>
        <p class="description">Access your work calendar</p>
        <form id="loginForm" novalidate>
            <fieldset>
                <legend>Login Information</legend>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
                <button type="submit" class="submit">Login</button>
            </fieldset>
        </form>
        <p class="link">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
