<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8663e">
    <title>Work Calendar — Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="container">
        <h1>Sign Up</h1>
        <p class="description">Create your work calendar account</p>
        <form id="signupForm" novalidate>
            <fieldset>
                <legend>Registration Form</legend>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required>

                <label for="repeat-password">Repeat Password</label>
                <input type="password" id="repeat-password" name="repeat-password" minlength="6" autocomplete="new-password" required>

                <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
                <button type="submit" class="submit">Sign Up</button>
            </fieldset>
        </form>
        <p class="link">Already have an account? <a href="index.html">Log In</a></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
